<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #ffffff;
  --card: #f3f4f6;
  --card2: #f9fafb;
  --navy-light: #e5e7eb;
  --navy-mid: #f9fafb;
  --orange: #ff6b2b;
  --orange-glow: #ff8c4c;
  --text: #111827;
  --text-muted: #6b7280;
  --cyan: #3b82f6;
  --green: #16a34a;
  --red: #ef4444;
  --border: #e5e7eb;
  --purple: #7c3aed;
  --yellow: #d97706;
  --accent: #4f46e5;
  --shadow: 0 1px 4px rgba(0,0,0,.08);
  --radius: 12px;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
  line-height: 1.6;
}

/* ─── HEADER ─── */
.header {
  background: rgba(255,255,255,0.95);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
  padding: 0 40px;
  position: sticky;
  top: 0;
  z-index: 100;
  height: 64px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.header-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
}

.logo {
  display: flex;
  align-items: center;
  gap: 12px;
}

.logo-badge {
  background: var(--accent);
  color: #fff;
  font-size: 11px;
  font-weight: 700;
  padding: 3px 9px;
  border-radius: 20px;
  letter-spacing: 0.5px;
  white-space: nowrap;
}

.logo-titles {
  display: flex;
  flex-direction: column;
  gap: 1px;
}

.logo-title {
  font-size: 14px;
  font-weight: 800;
  color: var(--text);
  line-height: 1.2;
}

.logo-sub {
  font-size: 11px;
  font-weight: 500;
  color: var(--accent);
  letter-spacing: 0.3px;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 16px;
}

/* ─── EXCHANGE RATE ─── */
.rate-box {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 6px 12px;
  font-size: 12px;
  color: var(--text);
}

.rate-box label {
  font-weight: 600;
  white-space: nowrap;
}

.rate-input {
  width: 72px;
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 3px 6px;
  font-size: 12px;
  text-align: right;
  outline: none;
  color: var(--text);
  background: #fff;
}

.rate-input:focus {
  border-color: var(--accent);
}

.rate-btn {
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 6px;
  padding: 4px 10px;
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
}

.rate-btn:hover {
  background: #4338ca;
}

.header-stats {
  display: flex;
  gap: 20px;
  align-items: center;
}

.stat-pill {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--text-muted);
}

.stat-pill strong {
  font-size: 13px;
  color: var(--text);
  font-weight: 700;
}

.stat-pill .dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
}

.dot-aaa { background: var(--orange); }
.dot-aa { background: var(--cyan); }
.dot-a { background: var(--green); }
.dot-indie { background: var(--text-muted); }

/* ─── FILTER GROUPS ─── */
.filter-group {
  margin-bottom: 12px;
}

.filter-label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 8px;
  display: block;
}

.filter-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.filter-btn {
  
  font-size: 0.78em;
  font-weight: 600;
  padding: 6px 18px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-muted);
  cursor: pointer;
  transition: all 0.18s;
  letter-spacing: 0.03em;
}

.filter-btn:hover {
  color: var(--text);
  border-color: #d1d5db;
  background: var(--card);
}

.filter-btn.active {
  background: var(--orange);
  border-color: var(--orange);
  color: #fff;
}

.filter-count {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 18px;
  height: 18px;
  font-size: 0.78em;
  font-weight: 700;
  padding: 0 5px;
  border-radius: 9px;
  margin-left: 5px;
  background: rgba(0,0,0,0.08);
  color: inherit;
  line-height: 1;
}

.filter-btn.active .filter-count {
  background: rgba(255,255,255,0.25);
  color: #fff;
}

.filter-btn.active.f-aa {
  background: var(--cyan);
  border-color: var(--cyan);
  color: #fff;
}

.filter-btn.active.f-a {
  background: var(--green);
  border-color: var(--green);
  color: #fff;
}

.filter-btn.active.f-indie {
  background: var(--text-muted);
  border-color: var(--text-muted);
  color: #fff;
}

.filter-btn.active.f-stage {
  background: var(--purple);
  border-color: var(--purple);
  color: #fff;
}
.filter-divider {
  width: 1px;
  height: 18px;
  background: var(--border);
  margin: 0 4px;
}

.search-input {
  margin-left: auto;
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 6px 16px;
  color: var(--text);
  font-size: 12px;
  outline: none;
  width: 200px;
  transition: border-color 0.18s;
}

.search-input::placeholder {
  color: var(--text-muted);
}

.search-input:focus {
  border-color: var(--accent);
}

/* ─── MAIN LAYOUT ─── */
.main {
  padding: 24px 40px;
  transition: margin-right 0.3s;
}

.main.panel-open {
  margin-right: 500px;
}

.section-label {
  
  font-size: 0.7em;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.section-label::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}

.section-count {
  font-size: 0.85em;
  color: var(--orange);
  background: rgba(255,107,43,0.1);
  padding: 1px 8px;
  border-radius: 10px;
}

/* ─── CARD GRID ─── */
.card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 14px;
  margin-bottom: 32px;
}

.game-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  cursor: pointer;
  transition: transform 0.18s, border-color 0.18s, box-shadow 0.18s;
  position: relative;
  overflow: hidden;
  box-shadow: var(--shadow);
}

.card-thumbnail {
  width: 100%;
  height: 160px;
  background: var(--navy-light);
  overflow: hidden;
  position: relative;
}

.card-thumbnail img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.3s;
}

.game-card:hover .card-thumbnail img {
  transform: scale(1.05);
}

.card-thumbnail .no-img {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-muted);
  font-size: 0.7em;
  opacity: 0.5;
}

.card-content {
  padding: 14px 18px 16px;
}

.game-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 2px;
  background: transparent;
  transition: background 0.18s;
}

.game-card:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(0,0,0,0.12);
}

.game-card:hover::before {
  background: var(--card-accent, var(--orange));
}

.game-card.active {
  border-color: var(--card-accent, var(--orange));
}

.game-card.active::before {
  background: var(--card-accent, var(--orange));
}

.card-tier {
  
  font-size: 0.6em;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 10px;
  display: inline-block;
  margin-bottom: 10px;
  letter-spacing: 0.06em;
}

.tier-aaa { background: rgba(255,107,43,0.12); color: #ea580c; }
.tier-aa { background: rgba(59,130,246,0.1); color: #2563eb; }
.tier-a { background: rgba(22,163,74,0.1); color: #15803d; }
.tier-indie { background: rgba(107,114,128,0.1); color: var(--text-muted); }

.card-name {
  
  font-size: 1.0em;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 4px;
  line-height: 1.3;
}

.card-dev {
  font-size: 0.7em;
  color: var(--text-muted);
  margin-bottom: 12px;
}

.card-meta {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.meta-chip {
  
  font-size: 0.62em;
  padding: 3px 8px;
  border-radius: 6px;
  background: #e5e7eb;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  gap: 4px;
}

.meta-chip svg {
  flex-shrink: 0;
}

.chip-release {
  color: var(--text);
}

.chip-bm-f2p {
  color: var(--green);
  background: rgba(52,211,153,0.1);
}

.chip-bm-b2p {
  color: var(--orange);
  background: rgba(255,107,43,0.1);
}

.chip-status-live {
  color: var(--green);
}

/* ─── WISHLIST CHIP ─── */
.chip-wishlist {
  color: #2563eb;
  background: rgba(59,130,246,0.08);
}

/* ─── STAGE BADGE ─── */
.stage-badge {
  
  font-size: 0.58em;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 10px;
  display: inline-block;
  letter-spacing: 0.04em;
}
.stage-launched { background: rgba(22,163,74,0.1); color: #15803d; }
.stage-alpha { background: rgba(255,107,43,0.1); color: #ea580c; }
.stage-beta { background: rgba(217,119,6,0.1); color: #b45309; }
.stage-demo { background: rgba(59,130,246,0.1); color: #2563eb; }
.stage-dev { background: rgba(107,114,128,0.1); color: var(--text-muted); }
.stage-delayed { background: rgba(239,68,68,0.1); color: #dc2626; }
.stage-unannounced { background: rgba(124,58,237,0.1); color: #7c3aed; }

.card-genre {
  font-size: 0.67em;
  color: var(--text-muted);
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px solid var(--border);
}

/* ─── CARD EXTRA ROW (wishlist + stage) ─── */
.card-extra-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px solid var(--border);
}

/* ─── DETAIL PANEL ─── */
.detail-panel {
  position: fixed;
  top: 0;
  right: -500px;
  width: 500px;
  height: 100vh;
  background: #fff;
  border-left: 1px solid var(--border);
  z-index: 200;
  transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  box-shadow: -4px 0 24px rgba(0,0,0,0.08);
}

.detail-panel.open {
  right: 0;
}

.panel-gallery {
  position: relative;
  width: 100%;
  height: 320px;
  background: var(--navy-light);
  overflow: hidden;
}

.gallery-container {
  position: relative;
  width: 100%;
  height: 100%;
}

.gallery-image {
  position: absolute;
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0;
  transition: opacity 0.3s;
}

.gallery-image.active {
  opacity: 1;
}

.gallery-controls {
  position: absolute;
  bottom: 10px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 6px;
  z-index: 10;
}

.gallery-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: rgba(255,255,255,0.4);
  cursor: pointer;
  transition: background 0.2s;
}

.gallery-dot.active {
  background: var(--accent);
}

.gallery-nav {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 32px;
  height: 32px;
  background: rgba(0,0,0,0.5);
  border: none;
  color: white;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  transition: background 0.2s;
  z-index: 9;
}

.gallery-nav:hover {
  background: rgba(0,0,0,0.8);
}

.gallery-nav.prev {
  left: 10px;
}

.gallery-nav.next {
  right: 10px;
}

.panel-header {
  padding: 20px 24px 16px;
  border-bottom: 1px solid var(--border);
  background: var(--card);
  flex-shrink: 0;
}

.panel-close {
  position: absolute;
  top: 16px;
  right: 16px;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--text-muted);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  transition: background 0.15s, color 0.15s;
  z-index: 11;
}

.panel-close:hover {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}

.panel-tier {
  margin-bottom: 8px;
}

.panel-title {
  
  font-size: 1.4em;
  font-weight: 800;
  color: var(--text);
  margin-bottom: 4px;
  padding-right: 36px;
  line-height: 1.25;
}

.panel-genre-tag {
  font-size: 0.72em;
  color: var(--text-muted);
}

.panel-body {
  flex: 1;
  overflow-y: auto;
  padding: 20px 24px;
  scrollbar-width: thin;
  scrollbar-color: var(--navy-light) transparent;
}

.panel-body::-webkit-scrollbar {
  width: 4px;
}

.panel-body::-webkit-scrollbar-track {
  background: transparent;
}

.panel-body::-webkit-scrollbar-thumb {
  background: var(--navy-light);
  border-radius: 2px;
}

.panel-meta-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 20px;
}

.panel-meta-item {
  background: var(--card);
  border-radius: 8px;
  padding: 10px 12px;
}

.panel-meta-label {
  
  font-size: 0.58em;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--text-muted);
  margin-bottom: 4px;
}

.panel-meta-value {
  font-size: 0.78em;
  color: var(--text);
  font-weight: 500;
  word-break: break-word;
}

/* ─── DETAIL PANEL DEV TOOLTIP ─── */
.dp-dev-wrap {
  position: relative;
  display: inline-block;
  cursor: help;
  color: var(--cyan);
  border-bottom: 1px dashed var(--cyan);
  transition: all 0.2s ease;
  font-weight: 700;
}
.dp-dev-wrap:hover {
  color: var(--orange);
  border-color: var(--orange);
}
.dp-dev-tooltip {
  visibility: hidden;
  opacity: 0;
  position: absolute;
  top: calc(100% + 12px);
  left: 0;
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px 14px;
  width: max-content;
  max-width: 280px;
  z-index: 9999;
  box-shadow: 0 10px 30px rgba(0,0,0,0.15);
  color: var(--text);
  font-size: 0.9em;
  font-weight: 400;
  white-space: normal;
  pointer-events: none;
  transform: translateY(-10px);
  transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}
.dp-dev-wrap:hover .dp-dev-tooltip {
  visibility: visible;
  opacity: 1;
  transform: translateY(0);
}

.dp-prev-title {
  
  font-size: 0.75em;
  color: var(--cyan);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  margin-bottom: 6px;
  display: block;
  font-weight: 700;
}

.panel-section {
  margin-bottom: 18px;
}

.panel-section-title {
  
  font-size: 0.62em;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--accent);
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.panel-section-title::after {
  content: '';
  flex: 1;
  height: 1px;
  background: rgba(79,70,229,0.2);
}

.panel-section-title.dev-response {
  color: var(--cyan);
}

.panel-section-title.dev-response::after {
  background: rgba(56,189,248,0.2);
}

.milestone-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.milestone-item {
  display: flex;
  gap: 10px;
  align-items: flex-start;
}

.milestone-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--accent);
  margin-top: 5px;
  flex-shrink: 0;
}

.milestone-text {
  font-size: 0.75em;
  color: var(--text-muted);
  line-height: 1.4;
}

.milestone-text.current {
  color: var(--accent);
  font-weight: 500;
}

.feedback-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.feedback-item {
  font-size: 0.75em;
  line-height: 1.45;
  padding: 8px 10px;
  border-radius: 6px;
}

.feedback-positive {
  background: rgba(22,163,74,0.06);
  color: #166534;
  border-left: 3px solid var(--green);
}

.feedback-positive::before {
  content: "▲ ";
  color: var(--green);
  font-size: 0.8em;
  font-weight: bold;
}

.feedback-concern {
  background: rgba(239,68,68,0.06);
  color: #991b1b;
  border-left: 3px solid var(--red);
}

.feedback-concern::before {
  content: "▼ ";
  color: var(--red);
  font-size: 0.8em;
  font-weight: bold;
}

.dev-box {
  background: rgba(59,130,246,0.05);
  border-left: 3px solid var(--cyan);
  border-radius: 0 8px 8px 0;
  padding: 10px 14px;
}

.dev-label {
  
  font-size: 0.58em;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--cyan);
  margin-bottom: 4px;
}

.dev-text {
  font-size: 0.73em;
  color: var(--text-muted);
  line-height: 1.5;
}

/* ─── STEAM DATA ─── */
.steam-data-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.steam-stat {
  background: rgba(59,130,246,0.05);
  border: 1px solid rgba(59,130,246,0.12);
  border-radius: 8px;
  padding: 8px 10px;
}
.steam-stat-label {
  
  font-size: 0.55em;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--text-muted);
  margin-bottom: 3px;
}
.steam-stat-value {
  
  font-size: 0.78em;
  font-weight: 700;
  color: var(--cyan);
}
.steam-stat-value.stat-green { color: var(--green); }
.steam-stat-value.stat-yellow { color: #b45309; }

.steam-stat-value.stat-muted { color: var(--text-muted); }

//  STATE & CONFIGURATION
// ═══════════════════════════════════════════
let currentTierFilter = 'all';
let currentGenreFilter = 'all';
let currentStageFilter = 'all';
let currentSearch = '';
let activeCardId = null;
let currentImageIndex = 0;

const TIER_CONFIG = {
  AAA:   { color: 'var(--orange)', cls: 'tier-aaa', accent: 'var(--orange)' },
  AA:    { color: 'var(--cyan)',   cls: 'tier-aa',  accent: 'var(--cyan)' },
  A:     { color: 'var(--green)', cls: 'tier-a',   accent: 'var(--green)' },
  Indie: { color: 'var(--text-muted)', cls: 'tier-indie', accent: 'var(--text-muted)' },
};

const STAGE_STYLE = {
  '출시 완료': 'stage-launched',
  '알파/베타': 'stage-alpha',
  '데모/PT': 'stage-demo',
  '개발 중': 'stage-dev',
  '연기/미정': 'stage-delayed',
};

// ═══════════════════════════════════════════
//  HELPER FUNCTIONS
// ═══════════════════════════════════════════

function getFilteredGames() {
  return GAMES.filter(game => {
    const tierMatch = currentTierFilter === 'all' || game.tier === currentTierFilter;
    const genreMatch = currentGenreFilter === 'all' || game.genre === currentGenreFilter;
    const stageMatch = currentStageFilter === 'all' || game.stageGroup === currentStageFilter;
    const searchMatch = !currentSearch || 
      game.name.toLowerCase().includes(currentSearch.toLowerCase()) ||
      game.dev.toLowerCase().includes(currentSearch.toLowerCase());
    
    return tierMatch && genreMatch && stageMatch && searchMatch;
  });
}

function groupGamesByTier(games) {
  const tierOrder = ['AAA', 'AA', 'A', 'Indie'];
  const grouped = {};
  
  tierOrder.forEach(tier => {
    grouped[tier] = games.filter(g => g.tier === tier);
  });
  
  return tierOrder
    .map(tier => ({
      tier,
      games: grouped[tier]
    }))
    .filter(group => group.games.length > 0);
}

function getBusinessModelClass(bm) {
  if (!bm) return '';
  const lower = bm.toLowerCase();
  if (lower.includes('f2p')) return 'chip-bm-f2p';
  if (lower.includes('b2p') || lower.includes('$')) return 'chip-bm-b2p';
  return '';
}

function formatWishlist(n) {
  if (!n) return null;
  if (n >= 1000) return (n / 1000).toFixed(1).replace(/\.0$/, '') + 'K';
  return String(n);
}

function getStageClass(stageGroup) {
  return STAGE_STYLE[stageGroup] || 'stage-dev';
}

function createGameCardHTML(game, tierConfig) {
  const isActive = game.id === activeCardId ? 'active' : '';
  const statusBadge = game.status === '출시완료' 
    ? '<span class="meta-chip chip-status-live">✓ 출시완료</span>' 
    : '';
  
  const hasImage = game.images && game.images.length > 0 && !game.images[0].startsWith('data:image/svg');
  const thumbnailHTML = hasImage
    ? `<div class="card-thumbnail"><img src="images/${game.images[0]}" alt="${game.name}" loading="lazy" onerror="this.onerror=null;this.src='${game.images[0]}';"></div>`
    : `<div class="card-thumbnail"><div class="no-img">공식 이미지 미공개</div></div>`;

  const wishlistChip = game.wishlist 
    ? `<span class="meta-chip chip-wishlist">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 1 0-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 0 0 0-7.78z"/></svg>
        ${formatWishlist(game.wishlist)}
       </span>` 
    : '';

  const stageBadge = `<span class="stage-badge ${getStageClass(game.stageGroup)}">${game.stage}</span>`;
  
  return `
    <div class="game-card ${isActive}" data-id="${game.id}" style="--card-accent:${tierConfig.accent}">
      ${thumbnailHTML}
      <div class="card-content">
        <span class="card-tier ${tierConfig.cls}">${game.tier}</span>
        ${stageBadge}
        ${game.isRemake ? '<span class="stage-badge" style="background:rgba(217,119,6,0.1);color:#b45309;margin-left:4px">리메이크</span>' : ''}
        ${game.isSinglePlayer ? '<span class="stage-badge" style="background:rgba(124,58,237,0.1);color:#7c3aed;margin-left:4px">싱글플레이어</span>' : ''}
        <div class="card-name">${game.name}</div>
        <div class="card-dev">${game.dev} · ${game.pub}</div>
        <div class="card-meta">
          <span class="meta-chip">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
            ${game.platform}
          </span>
          <span class="meta-chip chip-release">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
            ${game.release}
          </span>
          <span class="meta-chip ${getBusinessModelClass(game.bm)}">${game.bm}</span>
          ${wishlistChip}
          ${statusBadge}
        </div>
        <div class="card-genre">${game.genre}</div>
      </div>
    </div>
  `;
}

function createGalleryHTML(game) {
  if (!game.images || game.images.length === 0) {
    return `
      <div class="gallery-container">
        <div style="width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; color: var(--text-muted); font-size: 0.85em;">
          공식 이미지 미공개
        </div>
      </div>
    `;
  }

  const images = game.images.map((img, idx) => `
    <img src="images/${img}" onerror="this.onerror=null;this.src='${img}';" alt="Screenshot ${idx + 1}" class="gallery-image ${idx === 0 ? 'active' : ''}" />
  `).join('');

  const dots = game.images.length > 1 ? `
    <div class="gallery-controls">
      ${game.images.map((_, idx) => `<div class="gallery-dot ${idx === 0 ? 'active' : ''}" data-index="${idx}"></div>`).join('')}
    </div>
  ` : '';

  const navButtons = game.images.length > 1 ? `
    <button class="gallery-nav prev">‹</button>
    <button class="gallery-nav next">›</button>
  ` : '';

  return `
    <div class="gallery-container">
      ${images}
      ${dots}
      ${navButtons}
    </div>
  `;
}

function renderGrid() {
  const container = document.getElementById('gridContainer');
  const games = getFilteredGames();
  
  if (games.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
        <p>검색 결과가 없습니다.</p>
      </div>
    `;
    return;
  }
  
  const groups = groupGamesByTier(games);
  container.innerHTML = groups.map(({ tier, games: tierGames }) => {
    const cfg = TIER_CONFIG[tier];
    const cards = tierGames.map(g => createGameCardHTML(g, cfg)).join('');
    return `
      <div class="section-label" style="color:${cfg.color}">
        ${tier} <span class="section-count" style="background:${cfg.color}22;color:${cfg.color}">${tierGames.length}</span>
      </div>
      <div class="card-grid">${cards}</div>
    `;
  }).join('');

  container.querySelectorAll('.game-card').forEach(el => {
    el.addEventListener('click', () => {
      const id = parseInt(el.dataset.id);
      openDetailPanel(id);
    });
  });
}

function openDetailPanel(gameId) {
  const game = GAMES.find(x => x.id === gameId);
  if (!game) return;
  
  activeCardId = gameId;
  currentImageIndex = 0;
  renderGrid();

  const cfg = TIER_CONFIG[game.tier];
  
  // 갤러리
  document.getElementById('panelGallery').innerHTML = createGalleryHTML(game);
  setupGalleryControls(game);
  
  document.getElementById('panelTier').innerHTML = `<span class="card-tier ${cfg.cls}">${game.tier}</span> <span class="stage-badge ${getStageClass(game.stageGroup)}" style="margin-left:6px">${game.stage}</span>`;
  document.getElementById('panelTitle').textContent = game.name;
  document.getElementById('panelGenreTag').textContent = game.genre;

  let bodyHTML = '';

    ? `<span class="dp-dev-wrap">${game.dev}
         <span class="dp-dev-tooltip">
           <span class="dp-prev-title">개발사 전작</span>
           ${game.devPrevWorks}
         </span>
       </span>`
    : game.dev;

  // 메타 정보
  const wishlistDisplay = game.wishlist ? game.wishlist.toLocaleString() : 'N/A';
  bodyHTML += `
    <div class="panel-meta-grid">
      <div class="panel-meta-item"><div class="panel-meta-label">개발사</div><div class="panel-meta-value">${devDisplay}</div></div>
      <div class="panel-meta-item"><div class="panel-meta-label">퍼블리셔</div><div class="panel-meta-value">${game.pub}</div></div>
      <div class="panel-meta-item"><div class="panel-meta-label">세부 장르</div><div class="panel-meta-value">${game.genreDetail}</div></div>
      <div class="panel-meta-item"><div class="panel-meta-label">출시 일정</div><div class="panel-meta-value">${game.release}</div></div>
      <div class="panel-meta-item"><div class="panel-meta-label">Steam 공식 Tag</div><div class="panel-meta-value">${game.steamTags}</div></div>
      <div class="panel-meta-item"><div class="panel-meta-label">현재 상태</div><div class="panel-meta-value">${game.status}</div></div>
      <div class="panel-meta-item"><div class="panel-meta-label">위시리스트 (8.24 기준)</div><div class="panel-meta-value" style="color:var(--cyan)">${wishlistDisplay}</div></div>
      <div class="panel-meta-item"><div class="panel-meta-label">Steam Followers (8.24)</div><div class="panel-meta-value">${game.followers ? game.followers.toLocaleString() : 'N/A'}</div></div>
    </div>
  `;

  // Steam 링크

    bodyHTML += `
      <a href="${game.steamUrl}" target="_blank" rel="noopener" class="steam-link-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        Steam 페이지 바로가기
      </a>
    `;
  }

  // 리메이크 안내 배너
  if (game.remakeNote) {
    bodyHTML += `
      <div style="margin:12px 0;padding:12px 14px;background:rgba(217,119,6,0.08);border:1px solid rgba(217,119,6,0.2);border-radius:8px;">
        <div style="font-size:0.78em;font-weight:700;color:#b45309;margin-bottom:4px;">리메이크 타이틀</div>

    `;
  }

  // 싱글플레이어 전용 안내 배너
  if (game.isSinglePlayer) {
    bodyHTML += `
      <div style="margin:12px 0;padding:12px 14px;background:rgba(124,58,237,0.08);border:1px solid rgba(124,58,237,0.2);border-radius:8px;">
        <div style="font-size:0.78em;font-weight:700;color:#7c3aed;margin-bottom:4px;">싱글플레이어 전용</div>
        <div style="font-size:0.72em;color:var(--text);line-height:1.6;">멀티플레이어 없음 — 직접 경쟁 대상 아님</div>
      </div>
    `;
  }

  // Steam 실적 데이터
  if (game.steamData) {
    const sd = game.steamData;
    bodyHTML += `
      <div class="panel-section">
        <div class="panel-section-title" style="color:var(--cyan)">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20V10M18 20V4M6 20v-4"/></svg>
          Steam 실적 데이터
        </div>
        <div class="steam-data-grid">
    `;

    // 6개 커스텀 지표가 있는 게임 (Marathon, Toxic Commando 등)
    if (sd.launchMetrics) {
      sd.launchMetrics.forEach(m => {
        bodyHTML += `<div class="steam-stat"><div class="steam-stat-label">${m.label}</div><div class="steam-stat-value ${m.color || ''}">${m.value}</div></div>`;
      });
    } else {
      // 일반 게임들의 기본 지표 출력
      if (sd.rating) bodyHTML += `<div class="steam-stat"><div class="steam-stat-label">Steam 평가</div><div class="steam-stat-value ${sd.rating.includes('Very') || sd.rating.includes('Overwhelmingly') ? 'stat-green' : sd.rating.includes('Mostly') ? 'stat-yellow' : 'stat-muted'}">${sd.rating}</div></div>`;
      if (sd.peak) bodyHTML += `<div class="steam-stat"><div class="steam-stat-label">동시접속 피크</div><div class="steam-stat-value">${sd.peak}</div></div>`;
      if (sd.wishlist) bodyHTML += `<div class="steam-stat"><div class="steam-stat-label">위시리스트</div><div class="steam-stat-value">${sd.wishlist}</div></div>`;
      if (sd.reviews) bodyHTML += `<div class="steam-stat"><div class="steam-stat-label">리뷰 수</div><div class="steam-stat-value">${sd.reviews}</div></div>`;
      if (sd.owners) bodyHTML += `<div class="steam-stat"><div class="steam-stat-label">보유자 추정</div><div class="steam-stat-value">${sd.owners}</div></div>`;
    }

    bodyHTML += `</div>`;

    if (sd.testData) {
      bodyHTML += `
        <div style="margin-top:10px;padding:10px 12px;background:rgba(167,139,250,0.08);border:1px solid rgba(167,139,250,0.15);border-radius:8px;">
          <div class="steam-stat-label" style="color:var(--purple);margin-bottom:4px;">테스트 실적</div>
          <div style="font-size:0.75em;color:var(--text);line-height:1.5;">${sd.testData}</div>
        </div>
      `;
    }
    bodyHTML += `</div>`;
  }

  // 마일스톤
  if (game.milestones && game.milestones.length) {
    bodyHTML += `
      <div class="panel-section">
        <div class="panel-section-title">개발 로드맵</div>
        <div class="milestone-list">
          ${game.milestones.map(m => `
            <div class="milestone-item">
              <div class="milestone-dot" style="${m.current ? 'background:var(--orange);box-shadow:0 0 6px var(--orange)' : ''}"></div>
              <div class="milestone-text ${m.current ? 'current' : ''}">${m.text}</div>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  }

  // 평가
  if (game.pros && game.pros.length) {
    bodyHTML += `
      <div class="panel-section">
        <div class="panel-section-title">평가</div>
        <div class="feedback-list">
          ${game.pros.map(p => `<div class="feedback-item feedback-positive">${p}</div>`).join('')}
        </div>
      </div>
    `;
  }

  // 커뮤니티 부정 평가
  const concerns = game.concerns || game.cons;
  if (concerns && concerns.length) {
    bodyHTML += `
      <div class="panel-section">
        <div class="panel-section-title">커뮤니티 부정 평가</div>
        <div class="feedback-list">
          ${concerns.map(c => `<div class="feedback-item feedback-concern">${c}</div>`).join('')}
        </div>
      </div>
    `;
  }

  // 개발사 응답
  if (game.devResponse) {
    bodyHTML += `
      <div class="panel-section">
        <div class="panel-section-title dev-response">비고</div>
        <div class="dev-box">
          <div class="dev-text">${game.devResponse}</div>
        </div>
      </div>
    `;
  }

  document.getElementById('panelBody').innerHTML = bodyHTML;
  document.getElementById('panelBody').scrollTop = 0;
  document.getElementById('detailPanel').classList.add('open');
  document.getElementById('overlay').classList.add('visible');
  document.getElementById('main').classList.add('panel-open');
}

function setupGalleryControls(game) {
  if (!game.images || game.images.length <= 1) return;

  const dots = document.querySelectorAll('.gallery-dot');
  const images = document.querySelectorAll('.gallery-image');
  const prevBtn = document.querySelector('.gallery-nav.prev');
  const nextBtn = document.querySelector('.gallery-nav.next');

  const showImage = (index) => {
    images.forEach((img, i) => {
      img.classList.toggle('active', i === index);
    });
    dots.forEach((dot, i) => {
      dot.classList.toggle('active', i === index);
    });
    currentImageIndex = index;
  };

  if (prevBtn) {
    prevBtn.addEventListener('click', () => {
      const newIndex = (currentImageIndex - 1 + game.images.length) % game.images.length;
      showImage(newIndex);
    });
  }

  if (nextBtn) {
    nextBtn.addEventListener('click', () => {
      const newIndex = (currentImageIndex + 1) % game.images.length;
      showImage(newIndex);
    });
  }

  dots.forEach((dot, index) => {
    dot.addEventListener('click', () => showImage(index));
  });
}

function closeDetailPanel() {
  activeCardId = null;
  document.getElementById('detailPanel').classList.remove('open');
  document.getElementById('overlay').classList.remove('visible');
  document.getElementById('main').classList.remove('panel-open');
  renderGrid();
}

function updateFilterCounts() {
  // Count by tier
  const tierCounts = { all: GAMES.length };
  GAMES.forEach(g => { tierCounts[g.tier] = (tierCounts[g.tier] || 0) + 1; });
  document.querySelectorAll('[data-filter-type="tier"]').forEach(btn => {
    const f = btn.dataset.filter;
    const count = tierCounts[f] || 0;
    let badge = btn.querySelector('.filter-count');
    if (!badge) { badge = document.createElement('span'); badge.className = 'filter-count'; btn.appendChild(badge); }
    badge.textContent = count;
  });

  // Update header stats
  const el = (id) => document.getElementById(id);
  if (el('stat-aaa')) el('stat-aaa').textContent = tierCounts['AAA'] || 0;
  if (el('stat-aa')) el('stat-aa').textContent = tierCounts['AA'] || 0;
  if (el('stat-a')) el('stat-a').textContent = tierCounts['A'] || 0;
  if (el('stat-indie')) el('stat-indie').textContent = tierCounts['Indie'] || 0;

  // Count by stage
  const stageCounts = { all: GAMES.length };
  GAMES.forEach(g => { stageCounts[g.stageGroup] = (stageCounts[g.stageGroup] || 0) + 1; });
  document.querySelectorAll('[data-filter-type="stage"]').forEach(btn => {
    const f = btn.dataset.filter;
    const count = f === 'all' ? stageCounts.all : (stageCounts[f] || 0);
    let badge = btn.querySelector('.filter-count');
    if (!badge) { badge = document.createElement('span'); badge.className = 'filter-count'; btn.appendChild(badge); }
    badge.textContent = count;
  });

  // Count by genre
  const genreCounts = { all: GAMES.length };
  GAMES.forEach(g => { genreCounts[g.genre] = (genreCounts[g.genre] || 0) + 1; });
  document.querySelectorAll('[data-filter-type="genre"]').forEach(btn => {
    const f = btn.dataset.filter;
    const count = f === 'all' ? genreCounts.all : (genreCounts[f] || 0);
    let badge = btn.querySelector('.filter-count');
    if (!badge) { badge = document.createElement('span'); badge.className = 'filter-count'; btn.appendChild(badge); }
    badge.textContent = count;
  });
}

function renderCurrentView() {
  updateFilterCounts();
  if (currentView === 'grid') {
    document.getElementById('gridContainer').style.display = '';
    document.getElementById('calendarContainer').style.display = 'none';
    renderGrid();
  } else {
    document.getElementById('gridContainer').style.display = 'none';
    document.getElementById('calendarContainer').style.display = '';
    renderCalendar();
  }
}

// ═══════════════════════════════════════════
//  CALENDAR RENDERING
// ═══════════════════════════════════════════
let calYear = new Date().getFullYear();
let calMonth = new Date().getMonth() + 1;

function renderCalendar() {
  const container = document.getElementById('calendarContainer');
  const games = getFilteredGames();
  const today = new Date();
  let html = '';
  html += `<div class="cal-header">
    <div class="cal-nav">
      <button class="cal-nav-btn" onclick="calPrev()">◀</button>
      <div class="cal-month-label">${calYear}년 ${calMonth}월</div>
      <button class="cal-nav-btn" onclick="calNext()">▶</button>
      <button class="cal-nav-btn" onclick="calToday()" style="font-size:0.7em;width:auto;padding:0 10px;">Today</button>
    </div>
    <div class="cal-legend">
      <div class="cal-legend-item"><div class="cal-legend-dot" style="background:var(--orange)"></div> AAA</div>
      <div class="cal-legend-item"><div class="cal-legend-dot" style="background:var(--cyan)"></div> AA</div>
      <div class="cal-legend-item"><div class="cal-legend-dot" style="background:var(--green)"></div> A</div>
      <div class="cal-legend-item"><div class="cal-legend-dot" style="background:var(--text-muted)"></div> Indie</div>
    </div>
  </div>`;
  const firstDay = new Date(calYear, calMonth - 1, 1);
  const lastDay = new Date(calYear, calMonth, 0);
  const startDow = firstDay.getDay();
  const daysInMonth = lastDay.getDate();
  const dayNames = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
  html += `<div class="cal-grid">`;
  dayNames.forEach(d => { html += `<div class="cal-day-header">${d}</div>`; });
  for (let i = 0; i < startDow; i++) { html += `<div class="cal-cell empty"></div>`; }
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${calYear}-${String(calMonth).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday = today.getFullYear() === calYear && (today.getMonth()+1) === calMonth && today.getDate() === d;
    const dayGames = games.filter(g => { const rd = RELEASE_DATES[g.id]; return rd && rd.exact && rd.date === dateStr; });
    html += `<div class="cal-cell ${isToday ? 'today' : ''}"><div class="cal-date">${d}</div><div class="cal-games">
      ${dayGames.map(g => { const tcls = g.tier==='AAA'?'t-aaa':g.tier==='AA'?'t-aa':g.tier==='A'?'t-a':'t-indie'; const isPast = new Date(dateStr)<today; return `<div class="cal-game-chip ${tcls} ${isPast?'released':''}" onclick="openDetailPanel(${g.id})" title="${g.name}">${g.name}</div>`; }).join('')}
    </div></div>`;
  }
  const endDow = lastDay.getDay();
  for (let i = endDow + 1; i < 7; i++) { html += `<div class="cal-cell empty"></div>`; }
  html += `</div>`;

  // Timeline
  html += `<div style="margin-top:32px;"><div class="section-label" style="color:var(--orange)">
    ${calYear}년 ${calMonth}월 출시 일정</div>`;
  const prefix = `${calYear}-${String(calMonth).padStart(2,'0')}`;
  const monthGames = games.filter(g => { const rd = RELEASE_DATES[g.id]; return rd && rd.date && rd.date.startsWith(prefix); });
  if (monthGames.length === 0) {
    html += `<div style="text-align:center;padding:24px;color:var(--text-muted);font-size:0.85em;">이 달에 예정된 출시 일정이 없습니다.</div>`;
  } else {
    monthGames.forEach(g => {
      const rd = RELEASE_DATES[g.id]; const cfg = TIER_CONFIG[g.tier]; const isPast = rd && rd.exact && new Date(rd.date) < today;
      html += `<div class="timeline-row ${isPast?'past':''}" onclick="openDetailPanel(${g.id})">
        <div class="timeline-date-col">${rd.exact ? rd.date.split('-').slice(1).join('/') : rd.label}</div>
        <div class="timeline-tier-dot" style="background:${cfg.color}"></div>
        <div class="timeline-name">${g.name}</div>
        <div class="timeline-meta"><span class="timeline-badge">${g.tier}</span>
        ${isPast ? '<span class="timeline-badge released">출시완료</span>' : ''}</div></div>`;
    });
  }
  html += `</div>`;

  // Full timeline
  html += renderFullTimeline(games, today);
  container.innerHTML = html;
}

function renderFullTimeline(games, today) {
  let html = `<div style="margin-top:32px;"><div class="section-label" style="color:var(--cyan)">전체 출시 타임라인 (2025~2027)</div>`;
  const buckets = {
    'released': { label:'출시완료', games:[], color:'var(--green)' },
    '2026-Q1': { label:'2026 Q1 (1~3월)', games:[], color:'var(--orange)' },
    '2026-Q2': { label:'2026 Q2 (4~6월)', games:[], color:'var(--orange)' },
    '2026-H2': { label:'2026 H2 (7~12월)', games:[], color:'var(--cyan)' },
    '2026-TBD': { label:'2026 TBD', games:[], color:'var(--text-muted)' },
    '2027': { label:'2027', games:[], color:'var(--text-muted)' },
    'delayed': { label:'연기 / 미정', games:[], color:'var(--red)' },
  };
  games.forEach(g => {
    const rd = RELEASE_DATES[g.id];
    if (!rd) { buckets['2026-TBD'].games.push(g); return; }
    if (!rd.date) { buckets['delayed'].games.push(g); return; }
    const d = rd.date;
    if (d === '2027') { buckets['2027'].games.push(g); return; }
    if (rd.exact && new Date(d) < today) { buckets['released'].games.push(g); return; }
    if (d.includes('Q1') || (rd.exact && d.startsWith('2026-0') && parseInt(d.split('-')[1]) <= 3)) { buckets['2026-Q1'].games.push(g); }
    else if (d.includes('Q2') || (rd.exact && d.startsWith('2026-0') && parseInt(d.split('-')[1]) <= 6 && parseInt(d.split('-')[1]) > 3)) { buckets['2026-Q2'].games.push(g); }
    else if (d.includes('Q3') || d.includes('Q4') || d.includes('H2') || (rd.exact && d.startsWith('2026-') && parseInt(d.split('-')[1]) > 6) || d === '2026-12') { buckets['2026-H2'].games.push(g); }
    else if (d === '2026') { buckets['2026-TBD'].games.push(g); }
    else if (rd.exact) { const m=parseInt(d.split('-')[1]); if(m<=3) buckets['2026-Q1'].games.push(g); else if(m<=6) buckets['2026-Q2'].games.push(g); else buckets['2026-H2'].games.push(g); }
    else { buckets['2026-TBD'].games.push(g); }
  });
  Object.entries(buckets).forEach(([key, bucket]) => {
    if (bucket.games.length === 0) return;
    html += `<div class="cal-quarter-row"><div class="cal-quarter-label" style="color:${bucket.color}">
      ${bucket.label} <span class="q-count" style="background:${bucket.color}22;color:${bucket.color}">${bucket.games.length}</span></div>`;
    bucket.games.forEach(g => {
      const rd = RELEASE_DATES[g.id]; const cfg = TIER_CONFIG[g.tier]; const isPast = rd && rd.exact && new Date(rd.date) < today;
      html += `<div class="timeline-row ${isPast?'past':''}" onclick="openDetailPanel(${g.id})">
        <div class="timeline-date-col">${rd ? (rd.exact ? rd.date : rd.label) : 'TBD'}</div>
        <div class="timeline-tier-dot" style="background:${cfg.color}"></div>
        <div class="timeline-name">${g.name}</div>
        <div class="timeline-meta"><span class="timeline-badge">${g.tier}</span><span class="timeline-badge">${g.bm}</span>
        ${isPast ? '<span class="timeline-badge released">출시완료</span>' : ''}
        ${key === 'delayed' ? '<span class="timeline-badge delayed">연기</span>' : ''}</div></div>`;
    });
    html += `</div>`;
  });
  html += `</div>`;
  return html;
}

function calPrev() { calMonth--; if(calMonth<1){calMonth=12;calYear--;} renderCalendar(); }
function calNext() { calMonth++; if(calMonth>12){calMonth=1;calYear++;} renderCalendar(); }
function calToday() { const t=new Date(); calYear=t.getFullYear(); calMonth=t.getMonth()+1; renderCalendar(); }

document.querySelectorAll('[data-filter-type="tier"]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('[data-filter-type="tier"]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentTierFilter = btn.dataset.filter;
    closeDetailPanel();
    renderCurrentView();
  });
});

document.querySelectorAll('[data-filter-type="genre"]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('[data-filter-type="genre"]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentGenreFilter = btn.dataset.filter;
    closeDetailPanel();
    renderCurrentView();
  });
});

document.querySelectorAll('[data-filter-type="stage"]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('[data-filter-type="stage"]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentStageFilter = btn.dataset.filter;
    closeDetailPanel();
    renderCurrentView();
  });
});

document.getElementById('searchInput').addEventListener('input', e => {
  currentSearch = e.target.value;
  renderCurrentView();
});

document.getElementById('panelClose').addEventListener('click', closeDetailPanel);
document.getElementById('overlay').addEventListener('click', closeDetailPanel);

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeDetailPanel();
});

// 초기 렌더링
renderCurrentView();

</script>
</body>
</html>
